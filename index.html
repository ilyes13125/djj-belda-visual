<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BELDA — Visual</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- La scène : tout le visuel vit ici, dans un cadre 16:9 -->
  <div class="stage">
    <!-- Le tunnel d'étoiles est tout au fond (indépendant du logo et du DJ).
         Le logo vient ensuite : il reste visuellement "derrière" le DJ,
         qui est peint par-dessus juste après (vraie sensation de profondeur). -->
    <canvas id="starfield-canvas"></canvas>
    <canvas id="logo3d-canvas"></canvas>

    <!-- Les halos sont peints AVANT le DJ -->
    <div class="halo halo-main"></div>
    <div class="halo halo-head"></div>

    <img class="dj-silhouette" src="dj_silhouette.png" alt="">

    <!-- Visage IA -->
    <canvas id="face3d-canvas"></canvas>

    <div class="dj-fade-bottom"></div>
    <div class="mist mist-1"></div>
    <div class="mist mist-2"></div>
    <div class="mist mist-3"></div>
    <div class="vignette"></div>
    <div class="grain"></div>

    <!-- DJ BELDA -->
    <div class="dj-belda-tag">
      <div class="dj-belda-intro">
        <div class="dj-belda-drift">
          <span class="txt">BELDA</span>
        </div>
      </div>
    </div>

    <div class="name-reveal">
      <div class="name-line1"></div>
      <div class="name-line2"></div>
    </div>

    <!-- Logo casquette -->
    <img class="cap-outline-logo" src="belda_cap_logo.png" alt="">
  </div>

  <script src="three.min.js"></script>
  <script src="starfield.js"></script>
  <script src="logo3d.js"></script>
  <script src="face3d.js"></script>
  <script src="timeline.js"></script>
</body>
</html>
